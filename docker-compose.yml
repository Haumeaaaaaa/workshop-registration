version: '3.8'

services:
  proxy:
    image: workshop-proxy:${TAG:-latest}
    build: ./proxy
    ports:
      - "8080:80"
    networks:
      - app-network
    depends_on:
      - frontend
      - workshops-api
      - registrations-api

  frontend:
    image: workshop-frontend:${TAG:-latest}
    build: ./frontend
    networks:
      - app-network

  workshops-api:
    image: workshop-workshops-api:${TAG:-latest}
    build: ./workshops-api
    networks:
      - app-network
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=workshop_db

  registrations-api:
    image: workshop-registrations-api:${TAG:-latest}
    build: ./registrations-api
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=workshop_db
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-me-dev}

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: workshop_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data: